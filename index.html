<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>これって浮気？ | VALORANT診断</title><meta name="description" content="40のシチュエーションで、あなたのデュオの境界線を見つける診断。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1923'/%3E%3Cpath d='M7 9l9 15 9-15h-6l-3 6-3-6z' fill='%23ff4655'/%3E%3C/svg%3E"><style>
:root{--ink:#0f1923;--red:#ff4655;--paper:#ece8e1}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--ink);font-family:"Yu Gothic",Meiryo,sans-serif;font-size:16px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible+span{outline:3px solid #317aff;outline-offset:4px}.shell{max-width:1000px;margin:32px auto;background:var(--paper);padding:36px 56px;min-height:90vh}.eyebrow{font-weight:800;font-size:14px;letter-spacing:.15em;color:var(--red)}header{border-top:4px solid var(--ink);padding-top:22px}h1{font-size:clamp(32px,5vw,58px);line-height:1.2;letter-spacing:-.04em;margin:12px 0 18px;font-weight:900}h1 span{display:block}.tag{display:inline-block;background:var(--red);color:white;padding:8px 22px;font-weight:900;transform:skew(-12deg);font-size:16px}.intro{line-height:1.8;margin:20px 0 26px}.status{display:flex;justify-content:space-between;gap:10px;font-weight:bold;font-size:14px;margin:22px 0 10px}.track{height:5px;background:#c9c6c0}.track div{background:var(--red);height:100%;transition:width .25s}.section-title{display:flex;align-items:center;gap:16px;margin:28px 0 16px}.section-title b{color:var(--red);font-size:14px;letter-spacing:.08em}.section-title h2{font-size:20px;margin:0}.legend{display:flex;gap:10px;background:var(--ink);color:white;padding:16px;justify-content:space-between;font-size:14px;font-weight:bold}.question{padding:23px 0;border-bottom:1px solid #b4b5b5}fieldset{border:0;margin:0;padding:0}legend{width:100%;font-weight:800;font-size:18px;line-height:1.65;margin-bottom:14px}.num{display:inline-block;background:var(--red);color:white;min-width:44px;text-align:center;margin-right:12px;transform:skew(-10deg);font-weight:900}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{position:relative;cursor:pointer}.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice span{display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #a3a8ab;min-height:50px;background:#f7f5f1;padding:9px;font-size:14px;font-weight:700;transition:.15s}.choice:hover span{border-color:var(--ink)}.choice input:checked+span{background:var(--ink);color:white;border-color:var(--ink);box-shadow:inset 0 -4px var(--red)}.actions{display:flex;justify-content:space-between;gap:12px;margin:28px 0}.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:15px 24px;font-weight:800;min-height:52px}.primary{background:var(--red);border-color:var(--red);color:white}.btn:disabled{cursor:default;opacity:.5}.error{color:#a92330;font-weight:bold;line-height:1.6}.extra{background:white;border:2px solid var(--ink);padding:22px;margin-top:24px}.extra h2{font-size:18px;margin-top:0}footer{border-top:1px solid #b4b5b5;margin-top:32px;padding-top:18px;color:#56616a;font-size:14px;line-height:1.8}footer a{color:inherit}.result-title{font-size:32px;margin:16px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{background:var(--ink);color:white;padding:20px 12px;text-align:center}.stat strong{font-size:36px;display:block;color:var(--red);margin-bottom:8px}.stat span{font-size:14px}.result-copy{line-height:1.9}.review{margin-top:24px}.review summary{font-weight:bold;cursor:pointer;padding:18px 0;border-bottom:2px solid var(--ink)}.review-row{padding:14px 0;border-bottom:1px solid #b4b5b5;line-height:1.7}.review-row b{color:#b52c3b;font-size:14px;display:block}.hidden{display:none}@media(max-width:650px){.shell{margin:0;padding:26px 20px;min-height:100vh}.intro{font-size:14px}.legend{gap:8px;padding:12px 8px;font-size:12px}.choices{gap:6px}.choice span{font-size:12px;padding:10px 4px;min-height:56px}legend{font-size:16px}.num{min-width:35px;margin-right:8px}.summary{gap:6px}.stat{padding:18px 5px}.stat span{font-size:12px}.btn{padding:14px 16px}.result-title{font-size:27px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="shell"><header><div class="eyebrow">DUO BOUNDARY CHECK</div><h1>これって浮気？<span>判定シート</span></h1><div class="tag">VALORANT ver.</div><p class="intro">デュオ相手との距離感、どこまでならOK？<br>40のシチュエーションに、素直な気持ちで答えてみよう。</p></header><div id="quiz"><div class="status"><span id="pageLabel"></span><span id="count" aria-live="polite"></span></div><div class="track" role="progressbar" aria-label="回答の進捗" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0"><div id="progress"></div></div><div class="section-title"><b id="range"></b><h2 id="section"></h2></div><div class="legend"><span>① 浮気</span><span>② 浮気じゃないけど嫌</span><span>③ 全然OK</span></div><form id="form"><div id="questions"></div><div id="extra" class="extra hidden"><h2>自分がやる側なら答えは変わりますか？</h2><div class="choices" style="grid-template-columns:1fr 1fr"><label class="choice"><input type="radio" name="self" value="yes"><span>はい</span></label><label class="choice"><input type="radio" name="self" value="no"><span>いいえ</span></label></div></div><p id="error" class="error" role="alert"></p><div class="actions"><button id="back" class="btn" type="button">前のページ</button><button id="next" class="btn primary" type="submit">次の20問へ</button></div></form></div><section id="result" class="hidden" tabindex="-1"></section><footer>この診断は、浮気の事実を判定するものではありません。お互いの「嫌」と「OK」を話し合うきっかけにどうぞ。<br>設問：提供された判定シート（全40項目）／参考：<a href="https://ikura1.github.io/uwaki-hantei/" target="_blank" rel="noopener">これって浮気？診断</a><br>回答はこのページ内でのみ扱います。再読み込みするとリセットされます。</footer></main><script>
const questions=["二人でこっそりデュオランクに行く","カスタムで二人きりの1v1をする","二人でアンレートに行く","異性のいるサーバーで一緒に大会配信を観戦する","誕生日にスキンをギフトで贈る","誕生日にスキンをギフトで貰う","毎日ディスコードでやりとりする","異性のいるサーバーで寝落ちする","試合の合間に恋愛相談する","「今のクラッチかっこよすぎ」と言われて喜ぶ","「ナイス！エイム神すぎ」と褒める","新しいスキンやランク昇格に気付いてほめる","おそろいのスキン/バディを使っている","異性の声が入ってるクリップをXにのせる","自分の知らないサブ垢がある","あだ名で呼び合う（報告中も）","二人だけの神試合の話で盛り上がる","「一番信頼してるデュオ」と言われる","「〇〇とデュオしたら楽しそう」と冗談ぽく言われて笑ってながす","相手が連敗で落ち込んでいるので話を聞く","相手がトロールされ泣いていたので慰める","相手と連携するためにメインエージェントを変える","フルパの後、二人だけ別のVCに移動する","二人だけのDiscordサーバーがある","パーティ招待が来たら即参加する","一緒にコレクションを見てスキン選びする","二人で深夜のデスマに行く","新マップ・新エージェントを二人で最初に触る","元恋人とフレンド登録したまま","元恋人のクリップにいいねする","元恋人のランク昇格にDMで「おめでとう！」と送る","元恋人にギフトで貰ったスキンを使い続ける","元恋人の配信をこっそり見ている","元恋人と考えた連携を今の恋人とやる","元恋人と二人きりでデュオランクに行く","元恋人に新しいデュオができたと聞いて残念がる","元恋人から「久しぶり、一戦やる？」ときて一試合だけ行く","二人で通話しながら画面共有で試合を見返す","本名など個人情報をお互いが知っている","リアルでオフ会・大会観戦をした"];
const labels=['浮気','浮気じゃないけど嫌','全然OK'];let page=0;const answers=Array(40).fill(null);let self=null;const $=id=>document.getElementById(id);
function update(){const n=answers.filter(a=>a!==null).length;$('count').textContent=n+' / 40 回答済み';$('progress').style.width=n/40*100+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',n)}
function render(){ $('pageLabel').textContent='PAGE '+(page+1)+' / 2';$('range').textContent=page?'21 — 40':'01 — 20';$('section').textContent=page?'距離感と、元恋人との関係':'日々のプレイとコミュニケーション';$('questions').innerHTML=questions.slice(page*20,page*20+20).map((q,j)=>{const i=page*20+j;return '<div class="question" id="q'+i+'"><fieldset><legend><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+q+'</legend><div class="choices">'+labels.map((l,k)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+k+'" '+(answers[i]===k?'checked':'')+'><span>'+l+'</span></label>').join('')+'</div></fieldset></div>'}).join('');$('back').disabled=!page;$('next').textContent=page?'診断結果を見る':'次の20問へ';$('extra').classList.toggle('hidden',!page);$('error').textContent='';update()}
$('form').addEventListener('change',e=>{if(e.target.name==='self'){self=e.target.value}else if(e.target.name.startsWith('q')){answers[Number(e.target.name.slice(1))]=Number(e.target.value)}update()});
$('back').onclick=()=>{page=0;render();window.scrollTo({top:0,behavior:'smooth'})};
$('form').onsubmit=e=>{e.preventDefault();const missing=answers.findIndex((a,i)=>i>=page*20&&i<page*20+20&&a===null);if(missing!==-1){$('error').textContent='このページのすべての項目に回答してください（未回答：'+(missing+1)+'問目）。';$('q'+missing).scrollIntoView({block:'center',behavior:'smooth'});$('q'+missing).querySelector('input').focus({preventScroll:true});return}if(!page){page=1;render();window.scrollTo({top:0,behavior:'smooth'});return}if(!self){$('error').textContent='最後の「自分がやる側なら」の質問にも回答してください。';$('extra').querySelector('input').focus();return}showResult()};
function getSummary(){const counts=labels.map((_,k)=>answers.filter(a=>a===k).length);return {answered:answers.filter(a=>a!==null).length,counts,self}}
function showResult(){const {counts}=getSummary();const max=Math.max(...counts),winners=counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0);const title=winners.length>1?'シーンごとに境界線を決めるあなた': ['デュオにも、はっきりした境界線を','信頼していても、嫌なことはある','デュオの交流を広く楽しめるあなた'][winners[0]];const copy=winners.length>1?'回答が分かれています。ひとつの基準でまとめず、気になるシーンを具体的に伝えてみましょう。':['二人きりの交流にも、恋人への配慮を大切にしたいタイプ。どの行動が嫌なのかを先に共有すると、すれ違いを減らせます。','浮気とまでは思わなくても、不快になる距離感があるようです。「浮気じゃないから大丈夫」で終わらず、嫌な気持ちも伝えてみましょう。','ゲームでの交流を比較的広く受け入れられるようです。相手のOKが自分と同じとは限らないので、お互いの境界線も確認してみましょう。'][winners[0]];$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML='<div class="eyebrow" style="margin-top:28px">YOUR RESULT</div><h2 class="result-title">'+title+'</h2><p class="result-copy">'+copy+'</p><div class="summary">'+counts.map((n,i)=>'<div class="stat"><strong>'+n+'<small style="font-size:14px"> / 40</small></strong><span>'+labels[i]+'</span></div>').join('')+'</div><div class="extra"><h2>自分がやる側なら？</h2><p class="result-copy">'+(self==='yes'?'「はい」と回答しました。相手にされる時と、自分がする時の違いはどこにあるか、一緒に考えてみましょう。':'「いいえ」と回答しました。自分にも相手にも同じ基準を持っています。その基準を具体的に共有してみましょう。')+'</p></div><p class="result-copy">結果は回答数の内訳にもとづく振り返りです。浮気の確率や、相手との相性を示すものではありません。</p><details class="review"><summary>40問の回答を振り返る</summary>'+questions.map((q,i)=>'<div class="review-row">'+String(i+1).padStart(2,'0')+'. '+q+'<b>'+labels[answers[i]]+'</b></div>').join('')+'</details><div class="actions"><button class="btn" id="edit">回答を見直す</button><button class="btn primary" id="restart">もう一度診断する</button></div>';$('edit').onclick=()=>{$('result').classList.add('hidden');$('quiz').classList.remove('hidden');page=0;render();window.scrollTo({top:0,behavior:'smooth'})};$('restart').onclick=()=>{answers.fill(null);self=null;document.querySelectorAll('[name=self]').forEach(i=>i.checked=false);$('edit').click()};$('result').focus();window.scrollTo({top:0,behavior:'smooth'})}
render();if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_diagnosis_answers',description:'現在の診断の回答内訳と回答済み数を読む。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>getSummary()})).catch(()=>{})}catch(e){}}
</script></body></html>
